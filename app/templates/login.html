{% extends "base.html" %}
{% block title %}ورود به تکسورا{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>💬 تکسورا</h1>
            <p>پلتفرم پیام‌رسان امن و هوشمند فارسی</p>
        </div>

        <div id="auth-error" class="error-message" hidden style="margin-bottom: 16px;"></div>

        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="username">نام کاربری یا ایمیل</label>
                <input type="text" id="username" name="username" placeholder="مثلاً: ali_reza" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary btn-block">ورود به حساب</button>
        </form>

        <div class="auth-link">
            حساب کاربری ندارید؟ <a href="/register">ثبت‌نام کنید</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/login.js"></script>
{% endblock %}
